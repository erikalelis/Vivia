name: Publicar VIVIA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Valores PÚBLICOS por diseño (la seguridad real está en las políticas RLS de Supabase).
          VITE_SUPABASE_URL: https://yjokpdxlhwfkbawztbkh.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_G3vksmvmv7G1HfUSQ3q3Kw_93TjQhw1
      # Para que recargar una pantalla interna (ej. /pendientes) no dé "404".
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
